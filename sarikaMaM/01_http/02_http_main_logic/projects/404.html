<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Premium Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-code {
            font-size: 8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div class="container animate-in">
        <h1 class="error-code">404</h1>
        <h1>Lost in Space?</h1>
        <p>The page you are looking for doesn't exist or has been moved to another dimension.</p>
        <a href="/" class="btn" style="background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);">Return to
            Safety</a>
    </div>
</body>

</html>
