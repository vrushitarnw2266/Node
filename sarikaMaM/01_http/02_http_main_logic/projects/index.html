<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        color: #333;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 800px;
        margin: 100px auto;
        padding: 40px;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    h1 {
        font-size: 3em;
        margin-bottom: 20px;
        color: #4a90e2;
    }

    p {
        font-size: 1.25em;
        margin-bottom: 30px;
        color: #666;
    }

    .btn {
        display: inline-block;
        padding: 15px 30px;
        font-size: 1.2em;
        color: #fff;
        background-color: #4a90e2;
        border-radius: 50px;
        text-decoration: none;
        transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .btn:hover {
        background-color: #357ABD;
        transform: translateY(-5px);
    }

    .nav-links {
        margin-top: 40px;
    }

    .nav-links a {
        margin: 0 15px;
        color: #4a90e2;
        text-decoration: none;
        font-weight: bold;
    }

    .nav-links a:hover {
        text-decoration: underline;
    }
</style>

<body>
    <div class="container home-theme animate-in">
        <h1>Digital Horizon</h1>
        <p>Step into a world of pure digital craftsmanship. We create experiences that redefine the boundaries of the
            modern web.</p>
        <a href="/about" class="btn">Explore Our Story</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
        </div>
    </div>
</body>

</html>
